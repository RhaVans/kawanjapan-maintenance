# Maintenance page for kawanjapan.com.
# HTML must answer 503 + Retry-After + no-store; assets must not (the page needs them to render).
# robots.txt must stay 200: a long-lived 5xx there can stop crawlers entirely.

server {
  listen 443 ssl http2;
  server_name kawanjapan.com www.kawanjapan.com;
  root /var/www/maintenance;

  error_page 503 /index.html;

  # Hashed assets: long cache, normal 200.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /robots.txt {
    try_files $uri =404;
  }

  # The maintenance document itself.
  location = /index.html {
    internal;
    add_header Retry-After 3600 always;
    add_header Cache-Control "no-store" always;
  }

  location / {
    return 503;
  }
}

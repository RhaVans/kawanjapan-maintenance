<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>kawanjapan.com is under maintenance</title>
<meta name="description" content="kawanjapan.com is temporarily down for maintenance. Leave your email and we'll tell you when it's back." />
<meta property="og:type" content="website" />
<meta property="og:title" content="kawanjapan.com is under maintenance" />
<meta property="og:description" content="kawanjapan.com is temporarily down for maintenance. Leave your email and we'll tell you when it's back." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="preload" href="/assets/fonts/bodoni-display.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/assets/fonts/bodoni-text.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/assets/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
<style>
@font-face{font-family:'Bodoni Display';src:url('/assets/fonts/bodoni-display.woff2') format('woff2');font-weight:500;font-display:block}
@font-face{font-family:'Bodoni Text';src:url('/assets/fonts/bodoni-text.woff2') format('woff2');font-weight:400;font-display:block}
@font-face{font-family:Archivo;src:url('/assets/fonts/archivo.woff2') format('woff2');font-weight:400 500;font-display:swap}
@font-face{font-family:'Shippori Mincho';src:url('/assets/fonts/shippori-mincho.woff2') format('woff2');font-weight:500;font-display:swap}

:root{--sumi:#000;--paper:#fff;--shu:#e8001c;--margin:clamp(20px,3vw,48px);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--sumi);font-family:Archivo,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
#ink{position:fixed;inset:0;display:block;width:100%;height:100lvh;z-index:0}
main{position:relative;z-index:1;min-height:var(--vvh,100dvh);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto;gap:clamp(28px,6vh,72px);
  padding:calc(var(--margin) + env(safe-area-inset-top)) calc(var(--margin) + env(safe-area-inset-right)) calc(var(--margin) + env(safe-area-inset-bottom)) calc(var(--margin) + env(safe-area-inset-left))}
.head{align-self:end}
h1{margin:0;font-weight:400}
h1[data-mask=on]{color:transparent}
.lead{display:block;font-family:'Bodoni Text',Georgia,serif;font-size:clamp(1.25rem,2.4vw,2rem);line-height:1.1}
.giant{display:block;font-family:'Bodoni Display',Georgia,serif;font-size:var(--giant,min(13vw,38vh));line-height:0.82;white-space:nowrap}

.info{display:grid;grid-template-columns:1fr;gap:clamp(20px,3.5vh,32px);font-size:1.0625rem;line-height:1.5}
.info p{margin:0;max-width:40ch}
.info p + p{margin-top:8px}
.ask{display:grid;gap:12px}
@media (min-width:1024px){
  .info{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:32px}
  .ask{justify-self:end;width:min(100%,26rem)}
}
.ja{font-family:'Shippori Mincho',serif;font-size:.9375rem;letter-spacing:.08em}

.notify{display:grid;gap:10px}
.notify label{font-weight:500;font-size:1rem;line-height:1.2}
.row{display:flex;gap:10px}
input[type=email]{flex:1;min-width:0;height:52px;padding:0 12px;border:2px solid var(--sumi);border-radius:0;background:var(--paper);color:var(--sumi);font:400 1rem/1.2 Archivo,sans-serif}
.notify button{height:52px;padding:0 24px;border:0;border-radius:0;background:var(--shu);color:var(--paper);font:500 1rem/1.2 Archivo,sans-serif;cursor:pointer;transition:background-color 120ms,color 120ms}
@media (hover:hover){.notify button:hover{background:var(--sumi)}}
.notify button:focus-visible{outline:3px solid var(--sumi);outline-offset:3px;background:var(--sumi)}
input[type=email]:focus-visible{outline:3px solid var(--sumi);outline-offset:3px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

.motion{align-self:start;justify-self:start;min-height:44px;margin-top:4px;padding:0;border:0;border-radius:0;background:none;color:var(--sumi);
  font:500 1rem/1.2 Archivo,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.motion:focus-visible{outline:3px solid var(--sumi);outline-offset:3px}

.status{margin:0;font-size:.875rem;line-height:1.4;max-width:40ch}
.status:empty{display:none}

@media (max-width:479px){.row{flex-direction:column}.notify button{width:100%}}
@media (max-height:480px) and (orientation:landscape){
  main{grid-template-rows:auto;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:end}
}
@media (forced-colors:active){#ink{display:none}}
</style>
</head>
<body>
<canvas id="ink" aria-hidden="true"></canvas>
<main>
  <div class="head">
    <h1>
      <span class="lead">kawanjapan.com is currently under</span>
      <span class="giant">maintenance</span>
    </h1>
  </div>
  <div class="info">
    <div class="say">
      <p>We're making some changes to the site. It will be back shortly.</p>
      <!--eta-->
      <!--ja--><p class="ja" lang="ja">ただいまメンテナンス中</p><!--/ja-->
      <button class="motion" id="motion" type="button" aria-pressed="false">Pause motion</button>
    </div>
    <div class="ask">
      <!--form-->
      <form class="notify" id="notify" method="post" action="%NOTIFY_ENDPOINT%">
        <label for="email">Email me once, when it's back</label>
        <div class="row">
          <input id="email" name="email" type="email" required placeholder="email@example.com" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" />
          <button type="submit">Notify me</button>
        </div>
        <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" />
      </form>
      <!--/form-->
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
